<div th:fragment="conteudo">
    <section class="layout-content">
        <nav class="navbar navbar-expand-md bg-light">
            <div class="collapse navbar-collapse" id="navbarsExampleDefault">
                <a class="btn btn-primary btn-md" href="/professores/cadastrar" role="button">
                    <span class="oi oi-plus" title="Cadastro" aria-hidden="true"></span>
                    <span>Cadastrar Professor</span>
                </a>
            </div>
        </nav>

        <div class="container">
            <div class="table-responsive">
                <table class="table table-striped table-hover table-sm">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nome</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="professor : ${professores}">
                            <td th:text="${professor.id}">1</td>
                            <td th:text="${professor.nome}">João Silva</td>
                            <td colspan="2">
                                <a class="btn btn-info btn-sm" th:href="@{/professores/editar/{id} (id=${professor.id})}" role="button">
                                    <span class="oi oi-brush" title="Editar" aria-hidden="true"></span>
                                </a>

                                <a class="btn btn-danger btn-sm" th:href="@{/professores/excluir/{id} (id=${professor.id})}" role="button">
                                    <span class="oi oi-trash" title="Excluir" aria-hidden="true"></span>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</div>
