<div th:fragment="conteudo">
    <section class="layout-content">
        <div class="page-header">
            <nav class="navbar navbar-expand-md navbar-light bg-light">
                <a class="btn btn-primary btn-md" href="/alunos/listar" role="button">
                    <span class="oi oi-spreadsheet" title="Cadastro" aria-hidden="true"></span>
                    <span>Listar Alunos</span>
                </a>
            </nav>
        </div>
    
        <div class="container" id="form-cadastro">
            <form th:action=" ${aluno.id == null} ? @{/alunos/salvar} : @{/alunos/editar}" method="POST" th:object="${aluno}">
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="nome">Nome do Aluno</label>
                        <input type="text" class="form-control" id="nome" placeholder="Nome Completo" th:field="*{nome}" />
    
                    </div>
                    <div class="form-group col-md-6">
                        <label for="email">E-mail</label>
                        <input type="email" class="form-control" id="email" placeholder="E-mail" th:field="*{email}" />
    
                    </div>
                    <div class="form-group col-md-6">
                        <label for="matricula">Matrícula</label>
                        <input type="text" class="form-control" id="matricula" placeholder="Matrícula" th:field="*{matricula}" />
    
                    </div>
                </div>
                <input type="hidden" th:field="*{id}" />
                <button type="submit" class="btn btn-primary btn-sm">Salvar</button>
            </form>
        </div>
    </section>
</div>
