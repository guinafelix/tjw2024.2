<div th:fragment="conteudo">
	<section class="layout-content">
		<nav class="navbar navbar-expand-md bg-light">
			<div class="collapse navbar-collapse" id="navbarsExampleDefault">

				<a class="btn btn-primary btn-md" href="/alunos/cadastrar" role="button">
					<span class="oi oi-plus" title="Cadastro" aria-hidden="true"></span>
					<span>Cadastrar Aluno</span>
				</a>
			</div>
		</nav>

		<div class="container">
			<div class="table-responsive">
				<table class="table table-striped table-hover table-sm">
					<thead>
						<tr>
							<th>#</th>
							<th>Nome</th>
							<th>E-mail</th>
							<th>Matrícula</th>
							<th>Ação</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="aluno : ${alunos}">
							<td th:text="${aluno.id}">1</td>
							<td th:text="${aluno.nome}">Fulano de Tal</td>
							<td th:text="${aluno.email}">fulano@gmail.com</td>
							<td th:text="${aluno.matricula}">2024.1-cc-1234</td>
							<td colspan="2">
								<a class="btn btn-info btn-sm" th:href="@{/alunos/editar/{id} (id=${aluno.id})}" role="button">
									<span class="oi oi-brush" title="Editar" aria-hidden="true"></span>
								</a>

								<a class="btn btn-danger btn-sm" th:href="@{/alunos/excluir/{id} (id=${aluno.id})} " role="button">
									<span class="oi oi-trash" title="Excluir" aria-hidden="true"></span>
								</a>


							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</section>
</div>
