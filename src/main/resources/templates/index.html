<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${titulo}"></title>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <link rel="icon" href="/image/favicon.png" />
    <link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/webjars/open-iconic/font/css/open-iconic-bootstrap.min.css" rel="stylesheet" />
    <link href="/css/style.css" rel="stylesheet" />
</head>

<body>
    <header>
        <nav class="navbar navbar-inverse navbar navbar-dark bg-dark fixed-top">
            <div class="container-fluid">
                <div class="navbar-header">
                    <button type="button" class="btn btn-dark navbar-toggle pull-left">
                        <i class="oi oi-menu"></i>
                    </button>
                    <a class="navbar-brand" href="#" ></a>
                </div>
            </div>
        </nav>
    </header>

    <div class="layout-main">
        <aside th:insert="~{fragments/menu :: menu}"></aside>

        <section class="layout-content">
            <div class="container" th:insert="~{home :: conteudo}">
            </div>
        </section>
    </div>

    <footer class="layout-footer">
        <div class="container">
            <span class="footer-copy"></span>
        </div>
    </footer>

    <script src="/webjars/jquery/jquery.min.js"></script>
    <script src="/webjars/jquery-mask-plugin/dist/jquery.mask.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script src="/webjars/bootstrap/js/bootstrap.min.js"></script>
    <script type="text/javascript">
        $(function () {
            $('[data-toggle="popover"]').popover();
        });
        $(document).ready(function () {
            $(".navbar-toggle").click(function () {
                $(".sidebar").toggleClass("sidebar-open");
            });
        });
    </script>
</body>
</html>
