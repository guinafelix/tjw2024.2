<div th:fragment="conteudo">
  <section class="layout-content">
    <div class="container">
      <div class="card">
        <div class="card-header">
          <div class="row align-items-center">
            <div class="col">
              <h5 class="card-title">Alunos da Turma</h5>
              <h6 class="card-subtitle text-muted" th:text="${turma.disciplina.nome + ' - ' + turma.semestre.ano + '/' + turma.semestre.semestre}"></h6>
            </div>
            <div class="col-auto">
              <a class="btn btn-primary btn-sm" th:href="@{/turmas/matricular/{id}(id=${turma.id})}" role="button">
                <span class="oi oi-plus"></span>
                <span>Adicionar Alunos</span>
              </a>
            </div>
          </div>
        </div>

        <div class="card-body">
          <div class="row mb-3">
            <div class="col-md-6">
              <p><strong>Professor:</strong> <span th:text="${turma.professor.nome}"></span></p>
            </div>
            <div class="col-md-6">
              <p><strong>Horário:</strong> <span th:text="${turma.horaInicio + ' - ' + turma.horaFim}"></span></p>
            </div>
          </div>

          <div th:if="${#lists.isEmpty(turma.alunos)}" class="alert alert-info">
            <span>Nenhum aluno matriculado nesta turma.</span>
          </div>

          <div th:if="${not #lists.isEmpty(turma.alunos)}" class="table-responsive">
            <table class="table table-striped table-hover">
              <thead>
                <tr>
                  <th>Matrícula</th>
                  <th>Nome</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="aluno : ${turma.alunos}">
                  <td th:text="${aluno.matricula}"></td>
                  <td th:text="${aluno.nome}"></td>
                  <td>
                    <a class="btn btn-danger btn-sm" 
                       th:href="@{/turmas/{turmaId}/remover-aluno/{alunoId}(turmaId=${turma.id},alunoId=${aluno.id})}"
                       onclick="return confirm('Tem certeza que deseja remover este aluno da turma?')">
                      <span class="oi oi-trash"></span>
                    </a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="card-footer">
          <a class="btn btn-secondary" th:href="@{/turmas/listar}">Voltar</a>
        </div>
      </div>
    </div>
  </section>
</div>
